services:
  vedio-website:
    build: .
    image: vedio-website:latest
    container_name: vedio-website
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 与宿主机媒体文件属主保持一致，可用 `id <你的用户>` 查看
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Shanghai
      PORT: "8080"
      # SQLite 数据库（播放进度/收藏），位于持久化卷内；留空则关闭该功能
      DB_PATH: "/data/vedio.db"
      # HLS 在线转码（MKV/HEVC 等浏览器不支持的格式按需转 H.264/AAC，多音轨自动出可选音轨）
      TRANSCODE_ENABLED: "true"
      TRANSCODE_MAX: "2"          # 同时转码任务上限，按 NAS CPU 性能调整
      TRANSCODE_IDLE_TIMEOUT: "30m" # 无人观看后多久停止转码进程（分片保留）
      # FFMPEG_BIN: "ffmpeg"      # 自定义 ffmpeg 路径
      # FFPROBE_BIN: "ffprobe"    # 自定义 ffprobe 路径（多音轨探测，随 ffmpeg 镜像自带）
      # 访问密码：取消注释并设置即开启登录认证
      # AUTH_PASSWORD: "change-me"
      # AUTH_SECRET: "please-change-to-a-long-random-string"
      # AUTH_TTL: "7d"
      # 经 HTTPS 反向代理访问时建议开启
      # AUTH_COOKIE_SECURE: "true"
    volumes:
      # 视频媒体目录（NAS 共享/挂载点），映射到容器内 /media
      - /volume1/videos:/media:ro
      # 缩略图缓存与运行数据，持久化到宿主机
      - ./data:/data
