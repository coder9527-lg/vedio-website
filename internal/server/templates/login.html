<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} · 我的视频库</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- 防闪烁：首帧绘制前按本地偏好写好 data-theme，与 theme.js 共用 vw:theme 约定 -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('vw:theme');
        if (m !== 'light' && m !== 'dark') m = 'system';
        var t = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script src="/static/js/theme.js" defer></script>
  <!-- PWA：可安装到主屏，静默依赖浏览器自带安装入口 -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="视频库">
  <script src="/static/js/pwa.js" defer></script>
</head>
<body class="login-page">
  <button type="button" class="theme-toggle-float" data-theme-toggle aria-label="切换主题">🌓</button>
  <main class="login-card">
    <h1>🔒 访问验证</h1>
    <p class="login-sub">{{if .MultiUser}}请输入账号与密码以继续{{else}}请输入访问密码以继续{{end}}</p>
    {{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="next" value="{{.Next}}">
      {{if .MultiUser}}
      <input type="text" name="username" autocomplete="username"
             placeholder="用户名" value="{{.Username}}" required autofocus>
      <input type="password" name="password" autocomplete="current-password"
             placeholder="密码" required>
      {{else}}
      <input type="password" name="password" autocomplete="current-password"
             placeholder="访问密码" required autofocus>
      {{end}}
      <button type="submit">登 录</button>
    </form>
  </main>
</body>
</html>
