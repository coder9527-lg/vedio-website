<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 · 个人视频库</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    .offline-card {
      text-align: center;
      padding: 40px;
      max-width: 360px;
    }
    .offline-icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    button {
      background: #38bdf8;
      color: #082f49;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>当前处于离线状态</h1>
    <p>视频库需要联网访问。请检查网络连接后重试，已缓存的页面骨架仍可正常展示。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </div>
</body>
</html>
